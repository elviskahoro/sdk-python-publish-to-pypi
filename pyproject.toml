[project]
name = "pypi-publisher"
version = "0.1.0"
description = "A reusable Python Dagger module for publishing distributions to PyPI."
readme = "readme.md"
requires-python = ">=3.14"
dependencies = ["dagger-io"]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
dagger-io = { path = "sdk", editable = true }
